---
import { getJuego, getUltimoSorteo, formatMoney } from '../lib/data';

export const prerender = true;

export function getStaticPaths() {
  return ['melate', 'melate-revancha', 'melate-revanchita', 'melate-retro', 'chispazo', 'chispazo-de-las-tres', 'tris', 'gana-gato'].map((juego) => ({ params: { juego } }));
}

const { juego } = Astro.params;
const j = getJuego(juego!);
const ultimo = getUltimoSorteo(juego!);
const title = j ? `${j.nombre} — Resultado` : 'Resultados Lotería MX';
const subtitle = ultimo
  ? `Sorteo ${ultimo.numero} · ${ultimo.fecha}`
  : 'Números ganadores de hoy';
const nums = ultimo ? ultimo.numeros.map((n) => n.toString().padStart(2, '0')).join('  ·  ') : '';
---
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <rect width="1200" height="630" fill="#0f172a"/>
  <rect x="0" y="0" width="1200" height="8" fill="#f59e0b"/>
  <text x="80" y="120" fill="#f59e0b" font-family="system-ui,sans-serif" font-size="28" font-weight="700">{title}</text>
  <text x="80" y="190" fill="#f1f5f9" font-family="system-ui,sans-serif" font-size="64" font-weight="700">{subtitle}</text>
  <text x="80" y="300" fill="#f1f5f9" font-family="system-ui,sans-serif" font-size="56" font-weight="700">{nums}</text>
  {ultimo?.adicional !== undefined && (
    <text x="80" y="380" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="36">Adicional: {ultimo.adicional.toString().padStart(2, '0)}</text>
  )}
  {ultimo?.bolsa_mxn && (
    <text x="80" y="460" fill="#f59e0b" font-family="system-ui,sans-serif" font-size="40" font-weight="700">Bolsa: {formatMoney(ultimo.bolsa_mxn)}</text>
  )}
  <text x="80" y="560" fill="#64748b" font-family="system-ui,sans-serif" font-size="24">resultados-loteria-mx.vercel.app</text>
</svg>
