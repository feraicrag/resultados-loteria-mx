name: Daily Loteria Scrape

on:
  schedule:
    # 22:30 UTC = 16:30 CST (after evening draws ~21:15 local)
    - cron: '30 22 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT || secrets.GH_TOKEN || github.token }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run scraper
        run: node scripts/scrape.mjs

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/resultados.json
          if git diff --staged --quiet; then
            echo "No changes"
          else
            git commit -m "chore: update resultados.json $(date -u +%Y-%m-%d)"
            git push
          fi
